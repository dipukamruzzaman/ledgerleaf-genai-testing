<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LedgerLeaf Bank{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" data-testid="brand">&#127811; LedgerLeaf Bank</a>
    <nav>
      {% if session.get('email') %}
        <a href="/dashboard" data-testid="nav-dashboard">Accounts</a>
        <a href="/transfer" data-testid="nav-transfer">Transfer</a>
        <a href="/logout" data-testid="nav-logout">Log out</a>
      {% else %}
        <a href="/login" data-testid="nav-login">Log in</a>
        <a href="/register" data-testid="nav-register">Open an account</a>
      {% endif %}
    </nav>
  </header>
  <main class="card">{% block content %}{% endblock %}</main>
  <footer class="foot">Fictional demo bank for software-testing practice. No real money or data.</footer>
</body>
</html>
