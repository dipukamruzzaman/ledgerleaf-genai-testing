{% extends "base.html" %}{% block title %}Log in · LedgerLeaf{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error" role="alert" data-testid="login-error">{{ error }}</p>{% endif %}
<form method="post" data-testid="login-form">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" data-testid="login-email" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" data-testid="login-password" required>
  <button type="submit" data-testid="login-submit">Log in</button>
</form>
<p><a href="/forgot" data-testid="forgot-link">Forgot your password?</a></p>
{% endblock %}
