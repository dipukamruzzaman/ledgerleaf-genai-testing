{% extends "base.html" %}{% block title %}Choose a new password · LedgerLeaf{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
{% if error %}<p class="error" role="alert" data-testid="reset-error">{{ error }}</p>{% endif %}
<form method="post" data-testid="reset-form">
  <label for="password">New password</label>
  <input id="password" name="password" type="password" data-testid="reset-password" required>
  <button type="submit" data-testid="reset-submit">Change password</button>
</form>
{% endblock %}
